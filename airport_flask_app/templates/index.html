<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #e0f7fa, #fce4ec);
            margin: 0;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #34495e;
        }

        h2 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease-in-out;
        }

        .nav-links {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
            width: 100%;
            max-width: 500px;
            animation: fadeInUp 1.2s ease-in-out;
        }

        .nav-links a {
            text-decoration: none;
            padding: 1rem 1.5rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            border-radius: 10px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-links a:hover {
            transform: translateY(-3px);
            background: linear-gradient(to right, #43e97b, #38f9d7);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h2>Welcome to <strong>SkyConnect ✈️</strong></h2>

    <div class="nav-links">
        <a href="{{ url_for('add_passenger') }}">➕ Add New Passenger</a>
        <a href="{{ url_for('flight_details') }}">🛫 View Flight & Airline Details</a>
        <a href="{{ url_for('airport_details') }}">🏢 View Airport Details</a>
        <a href="{{ url_for('security_info') }}">🔍 Search Passenger Security Info</a>
    </div>

</body>
</html>
